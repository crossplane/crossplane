apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnetworks.demo.crossplane.io
spec:
  compositeTypeRef:
    apiVersion: demo.crossplane.io/v1alpha1
    kind: XNetwork
  mode: Pipeline
  pipeline:
  - step: compose-in-order
    functionRef:
      name: function-ordering
    input:
      apiVersion: ordering.fn.crossplane.io/v1alpha1
      kind: Input
      # Ten resources, four levels deep: a diamond (instance needs both
      # subnets and the security group), fan-out from the vpc, two
      # independent branches, and one resource that depends on nothing.
      #
      #   standalone                        vpc
      #                        ┌────────┬────┴───┬────────┐
      #                    subnet-a  subnet-b  gateway    sg
      #                     │    └──────┬────────────────┘
      #                  database    instance
      #                     │           │
      #                   backup       app
      #
      # Each resource reports Ready 4s after it is created, so a wave
      # takes about four seconds - long enough to watch, short enough
      # to hold an audience.
      readyAfter: 4s
      resources:
      - vpc
      - subnet-a
      - subnet-b
      - gateway
      - sg
      - instance
      - app
      - database
      - backup
      - standalone
      edges:
      - {resource: subnet-a, dependsOn: vpc}
      - {resource: subnet-b, dependsOn: vpc}
      - {resource: gateway,  dependsOn: vpc}
      - {resource: sg,       dependsOn: vpc}
      - {resource: instance, dependsOn: subnet-a}
      - {resource: instance, dependsOn: subnet-b}
      - {resource: instance, dependsOn: sg}
      - {resource: app,      dependsOn: instance}
      - {resource: database, dependsOn: subnet-a}
      - {resource: backup,   dependsOn: database}
