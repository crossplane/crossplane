apiVersion: pkg.crossplane.io/v1beta1
kind: ImageConfig
metadata:
  name: provider-nop-package-name
spec:
  matchImages:
    - type: Prefix
      prefix: xpkg.upbound.io/crossplane-contrib/
  # Without this the dependency would be installed as
  # crossplane-contrib-provider-nop.
  packageName: "<< .Remainder >>"
