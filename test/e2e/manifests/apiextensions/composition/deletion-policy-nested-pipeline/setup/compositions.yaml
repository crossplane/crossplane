apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: deletion-policy-nested-pipeline-parent
spec:
  compositeTypeRef:
    apiVersion: example.org/v1alpha1
    kind: NestedPipelineDeletionParent
  mode: Pipeline
  deletionPolicy: Pipeline
  pipeline:
  - step: compose-children
    functionRef:
      name: function-python-deletion-policy-nested-pipeline
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        from crossplane.function import resource
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1

        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            policies = ["pipeline", "background"]

            # When the XR is deleted, delete the Background child before the
            # Pipeline child. Crossplane keeps the Background child in
            # observed state until it's really gone, so keep desiring the
            # Pipeline child until then.
            xr = resource.struct_to_dict(req.observed.composite.resource)
            if xr["metadata"].get("deletionTimestamp"):
                policies = ["pipeline"] if "background" in req.observed.resources else []

            # Compose a child XR with the Pipeline policy, and one with the
            # Background policy. Give them fixed names so the e2e test can
            # find them.
            for policy in policies:
                resource.update(rsp.desired.resources[policy], {
                    "apiVersion": "example.org/v1alpha1",
                    "kind": "NestedPipelineDeletionChild",
                    "metadata": {"name": "deletion-policy-nested-pipeline-" + policy},
                    "spec": {"crossplane": {"compositionRef": {"name": "deletion-policy-nested-pipeline-" + policy}}},
                })
                rsp.desired.resources[policy].ready = fnv1.READY_TRUE
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: deletion-policy-nested-pipeline-pipeline
spec:
  compositeTypeRef:
    apiVersion: example.org/v1alpha1
    kind: NestedPipelineDeletionChild
  mode: Pipeline
  deletionPolicy: Pipeline
  pipeline:
  - step: compose-configmaps
    functionRef:
      name: function-python-deletion-policy-nested-pipeline
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        from crossplane.function import resource
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1

        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            names = ["first", "second"]

            # When the XR is deleted, delete second before first. Crossplane
            # keeps second in observed state until it's really gone, so keep
            # desiring first until then.
            xr = resource.struct_to_dict(req.observed.composite.resource)
            if xr["metadata"].get("deletionTimestamp"):
                names = ["first"] if "second" in req.observed.resources else []

            # The e2e test holds the ConfigMaps with a finalizer, so it can
            # see the order they're deleted in.
            for name in names:
                resource.update(rsp.desired.resources[name], {
                    "apiVersion": "v1",
                    "kind": "ConfigMap",
                    "metadata": {
                        "labels": {
                            "e2e.crossplane.io/deletion-policy": "pipeline-parent-pipeline",
                            "e2e.crossplane.io/resource": name,
                        },
                        "finalizers": ["e2e.crossplane.io/hold"],
                    },
                    "data": {"name": name},
                })
                rsp.desired.resources[name].ready = fnv1.READY_TRUE
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: deletion-policy-nested-pipeline-background
spec:
  compositeTypeRef:
    apiVersion: example.org/v1alpha1
    kind: NestedPipelineDeletionChild
  mode: Pipeline
  deletionPolicy: Background
  pipeline:
  - step: compose-configmaps
    functionRef:
      name: function-python-deletion-policy-nested-pipeline
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        from crossplane.function import resource
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1

        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            # Compose two ConfigMaps. The e2e test holds them with a finalizer,
            # so it can see when they're deleted.
            for name in ("first", "second"):
                resource.update(rsp.desired.resources[name], {
                    "apiVersion": "v1",
                    "kind": "ConfigMap",
                    "metadata": {
                        "labels": {
                            "e2e.crossplane.io/deletion-policy": "pipeline-parent-background",
                            "e2e.crossplane.io/resource": name,
                        },
                        "finalizers": ["e2e.crossplane.io/hold"],
                    },
                    "data": {"name": name},
                })
                rsp.desired.resources[name].ready = fnv1.READY_TRUE
