apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xorderings.ordering.example.org
spec:
  compositeTypeRef:
    apiVersion: ordering.example.org/v1alpha1
    kind: XOrdering
  mode: Pipeline
  pipeline:
  - step: compose-in-order
    functionRef:
      name: function-ordering
    input:
      # Starting state: only the resource we are about to replace.
      apiVersion: ordering.fn.crossplane.io/v1alpha1
      kind: Input
      resources:
      - old
      readyAfter: 1s
