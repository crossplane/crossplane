apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xorderings.ordering.example.org
spec:
  compositeTypeRef:
    apiVersion: ordering.example.org/v1alpha1
    kind: XOrdering
  mode: Pipeline
  pipeline:
  - step: compose-in-order
    functionRef:
      name: function-ordering
    input:
      apiVersion: ordering.fn.crossplane.io/v1alpha1
      kind: Input
      # Each NopResource reports Ready 10s after creation, so every wave of the
      # graph takes a controlled, observable amount of time.
      readyAfter: 10s
      # A graph four levels deep, with a diamond (instance depends on two
      # subnets that both depend on the vpc), fan-out from the vpc, two
      # independent branches, and a resource with no dependencies at all.
      #
      #   standalone                        vpc
      #                        ┌────────┬────┴───┬────────┐
      #                    subnet-a  subnet-b  gateway    sg
      #                     │    └──────┬────────────────┘
      #                  database    instance
      #                     │           │
      #                   backup       app
      resources:
      - vpc
      - subnet-a
      - subnet-b
      - gateway
      - sg
      - instance
      - app
      - database
      - backup
      - standalone
      edges:
      - {resource: subnet-a, dependsOn: vpc}
      - {resource: subnet-b, dependsOn: vpc}
      - {resource: gateway,  dependsOn: vpc}
      - {resource: sg,       dependsOn: vpc}
      - {resource: instance, dependsOn: subnet-a}
      - {resource: instance, dependsOn: subnet-b}
      - {resource: instance, dependsOn: sg}
      - {resource: app,      dependsOn: instance}
      - {resource: database, dependsOn: subnet-a}
      - {resource: backup,   dependsOn: database}
