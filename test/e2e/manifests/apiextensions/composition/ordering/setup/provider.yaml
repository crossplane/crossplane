# A NopResource's deletion takes spec.forProvider.deleteAfter, which is what
# makes a teardown wave observable: without it a wave completes faster than a
# test can look at it, and ordered teardown is indistinguishable from an
# unordered cascade. Released in provider-nop v0.6.0, so this is the upstream
# image rather than a fork build.
#
# The DeploymentRuntimeConfig this references lives in its own file on purpose.
# A test that waits for this file's resources to report Healthy and Active
# can't also be pointed at a DeploymentRuntimeConfig, which has no conditions
# at all and so never satisfies the wait.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-nop-ordering
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-nop:v0.6.0
  runtimeConfigRef:
    name: provider-nop-fast-poll
