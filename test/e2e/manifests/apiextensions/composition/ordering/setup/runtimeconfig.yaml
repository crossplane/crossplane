# provider-nop flips a NopResource's conditions when it next polls the
# resource - not when the configured duration elapses. At the default 10s poll
# a readyAfter of 1s still costs up to 10s per wave, which dominated this test's
# runtime. Poll every second so the configured durations are what the test
# actually waits on. Deletion doesn't need this: since v0.6.0 provider-nop
# reconciles a deleting resource again as soon as its deleteAfter runs out.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-nop-fast-poll
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
          - name: package-runtime
            args:
            - --poll=1s
