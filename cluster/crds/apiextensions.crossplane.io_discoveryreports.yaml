      type: integer
    - jsonPath: .status.unmanagedResourceCount
      name: UNMANAGED
      type: integer
    - jsonPath: .status.lastDiscoveryTime
      name: LAST-SCAN
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DiscoveryReport documents the results of enumerating external
          resources of a given kind.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DiscoveryReportSpec specifies the desired state of resource
              discovery.
            properties:
              interval:
                default: 1h
                description: Interval specifies how often to discover resources of
                  this kind.
                type: string
              mrdRef:
                description: MRDRef references the ManagedResourceDefinition being
                  discovered.
                properties:
                  apiVersion:
                    description: APIVersion of the referenced object.
                    type: string
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                  uid:
                    description: UID of the referenced object.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              providerConfig:
                description: |-
                  ProviderConfig specifies which ProviderConfig to use for discovery.
                  If empty, discovery runs for all ProviderConfigs of the MRD's provider.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
