  names:
    categories:
    - crossplane
    kind: DiscoveryReport
    listKind: DiscoveryReportList
    plural: discoveryreports
    shortNames:
    - dreport
    - dreports
    singular: discoveryreport
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mrdRef.name
